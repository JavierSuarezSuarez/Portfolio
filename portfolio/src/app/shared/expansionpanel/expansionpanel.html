
<!--ExpansionPanel generado dinamicamente-->
<mat-expansion-panel class="expansionPanel" [expanded]="this.seccionCargada">
    <!--Header ExpansionPanel-->
    <mat-expansion-panel-header>
        <mat-panel-title>        
            <span class="tituloSeccion">{{ titulo }}</span>
        </mat-panel-title>
    </mat-expansion-panel-header>

    <!-- Contenido ExpansionPanel-->
    <div class="contenidoExpansionPanel">
        <span class="textoSeccion">{{ texto }}</span>
    </div>
</mat-expansion-panel>
